name: Publish to PSGallery

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PowerShell 7.5
        uses: bjompen/UpdatePWSHAction@v1.0.0
        with:
          ReleaseVersion: '7.5'

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Task Build

      - name: Run tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests/Unit'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = './TestResults/testResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) test(s) failed"
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./build.ps1 -Task Analyze

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./output/pwssh/pwssh.psd1

      - name: Publish to PSGallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
              throw 'NUGET_API_KEY secret is not set. Add it at Settings > Secrets > Actions.'
          }
          Publish-Module -Path ./output/pwssh -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery
          Write-Host "Published pwssh to PSGallery." -ForegroundColor Green
