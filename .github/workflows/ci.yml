name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

# The workflow only reads the repository; nothing here needs a write token.
permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows PowerShell 5.1 (.NET Framework)
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
          # PowerShell 7 as preinstalled on the runner images
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
          - name: PowerShell 7 on Ubuntu
            os: ubuntu-latest
            shell: pwsh
          - name: PowerShell 7 on macOS
            os: macos-latest
            shell: pwsh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show PowerShell version
        run: $PSVersionTable | Out-String

      # Downloads the hash-pinned dependencies, stages ./output and runs Tests/Unit
      - name: Build and run unit tests
        run: ./build.ps1 -Task Test

      # Import the staged module exactly as a user would and make sure SSH.NET
      # and its dependencies load on this edition.
      - name: Import built module
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./output/pwssh/pwssh.psd1 -Force
          if (-not ('Renci.SshNet.SshClient' -as [type])) { throw 'SSH.NET did not load' }
          # Touch a type that needs BouncyCastle, so a missing dependency fails here
          $null = [Renci.SshNet.ConnectionInfo]::new('localhost', 22, 'u',
              [Renci.SshNet.AuthenticationMethod[]]@([Renci.SshNet.NoneAuthenticationMethod]::new('u')))
          $dir = Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString('N'))
          $key = New-SSHKeyPair -Path (Join-Path $dir 'id_smoke') -Comment 'ci smoke'
          if (-not (Test-SSHKeyFile -Path $key.PrivateKeyPath).Valid) { throw 'generated key did not validate' }
          "Loaded $((Get-Command -Module pwssh).Count) commands; key $($key.Fingerprint)"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}-${{ matrix.shell }}
          path: TestResults/

  integration:
    name: Integration (OpenSSH server)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install OpenSSH server
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server openssh-client
          sudo mkdir -p /run/sshd

      # Starts a private sshd on a loopback port as the runner user and drives the
      # built module against it (see Tests/Integration).
      - name: Build and run integration tests
        run: ./build.ps1 -Task Integration

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: TestResults/

  package:
    name: Package module
    runs-on: ubuntu-latest
    needs: [ unit, integration ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Task Build

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwssh-module
          path: output/pwssh/
